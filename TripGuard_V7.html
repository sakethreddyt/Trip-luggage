<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripGuard V7</title><meta name="theme-color" content="#17365d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧳%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#17243b;--mu:#68778d;--pr:#17365d;--ac:#1b8f83;--ok:#16836b;--wn:#b7791f;--bd:#dce4ef;--bad:#c2414b;--soft:#edf3f8;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}
body{font:16px/1.45 Figtree,system-ui,sans-serif;color:var(--tx);padding-bottom:92px}
main{max-width:900px;margin:0 auto;padding:18px 13px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;color:#142b49}h1{font-size:30px;margin:4px 0 14px}h2{font-size:20px;margin:20px 0 8px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(29,55,87,.05)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
input,select,button{font:inherit;color:var(--tx);border:1px solid #cfd9e6;border-radius:11px;padding:10px 12px;background:#fff;min-height:44px;max-width:100%}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(27,143,131,.15);outline:0}
button{cursor:pointer;font-weight:650;background:#f5f8fb;color:#25415f}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--bad)}button.s{min-height:36px;padding:5px 11px;font-size:14px}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label.mu{display:block;margin:10px 0 4px}.wide{width:100%}
.tag{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{color:var(--ok)}.wn{color:var(--wn)}.bad{color:var(--bad)}.mu2{color:var(--mu)}
.msg{border-left:4px solid var(--mu);border-radius:12px;padding:12px 14px;background:#f3f7fb;margin:12px 0;font-weight:500}.msg.ok{border-color:var(--ok)}.msg.wn{border-color:var(--wn)}.msg.bad{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ph{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);display:block}.nop{display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--soft)}
.th{width:40px;height:40px;object-fit:cover;border-radius:8px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:26px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;backdrop-filter:blur(12px)}
nav button{flex:1;min-width:0;border:0;background:none;font-size:11px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;min-height:50px;border-radius:10px}nav button span{font-size:19px}
nav button.on{background:var(--ac);color:#fff}
@media(min-width:761px){body{padding:64px 0 24px}nav{top:0;bottom:auto;justify-content:center;gap:6px;border:0;border-bottom:1px solid var(--bd)}nav button{flex:0 1 128px;flex-direction:row;gap:8px;font-size:14px}}
#cam{max-width:520px;margin:10px auto;border:2px solid var(--ac);border-radius:16px;overflow:hidden;min-height:120px;background:#000;display:none}#cam video{width:100%!important;display:block}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}#modal .card{text-align:center;max-width:340px;width:100%}#modal .q{background:#fff;padding:12px;display:inline-block;border-radius:10px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}body{padding:0;background:#fff}#pr{display:grid!important}#pr.g1{grid-template-columns:1fr}#pr.g6{grid-template-columns:repeat(2,1fr);gap:4mm}#pr.g15{grid-template-columns:repeat(3,1fr);gap:3mm}
.lb{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#000;background:#fff;border:1px dashed #888;padding:3mm;break-inside:avoid;font-family:Arial,sans-serif}.lb b{font-size:20px}.lb small{font-size:11px}
.g1 .lb{height:255mm;border:0;break-after:page}.g1 .lb b{font-size:54px}.g1 .lb small{font-size:18px}.g6 .lb{height:84mm}.g15 .lb{height:51mm}@page{size:A4;margin:10mm}}
</style></head><body>
<main><div id="v"></div><div id="cam"></div><div id="v2"></div></main>
<div id="modal"><div class="card"><h3 id="mt"></h3><p class="mu" id="ms"></p><div class="q" id="mq"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="p" id="mp">🖨 Print this tag</button><button onclick="$('#modal').style.display='none'">Close</button></div></div></div>
<div id="pr"></div><nav id="nav"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const tok=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
const fresh=()=>({trip:{name:'My trip',date:''},members:[],tags:[],bags:[],j:{from:'',to:'',stops:[],started:false},bc:[],pc:[]});
const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('tripguard7',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{const o=q.result.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k');const x=m==='get'?o.get('s'):o.put(v,'s');x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()}catch(_){r()}});
const TYPES=['Suitcase','Backpack','Duffel bag','Handbag','Box / carton','Other'];
let S=fresh(),tab='trip',view={m:null},reg=null,msg=null,sc=null,camOn=false,last={t:'',at:0},stage=null,ctab='bag',ready=false,selT=new Set();
const save=()=>{if(ready)idb('put',S)};
const M=i=>S.members.find(x=>x.id===i),TG=i=>S.tags.find(x=>x.id===i),BG=i=>S.bags.find(x=>x.id===i),used=t=>S.bags.some(b=>b.tagId===t.id);
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const tag=(t,c)=>`<span class='tag ${c}'>${e(t)}</span>`;
const stages=()=>[{id:'start',name:S.j.from,role:'Start'},...S.j.stops.map(x=>({id:x.id,name:x.name,role:'Connecting'})),{id:'end',name:S.j.to,role:'Destination'}];
const curStage=()=>stages().find(x=>x.id===stage)||stages()[0];
const msgHtml=()=>msg?`<div class='msg ${msg.c}'>${e(msg.t)}${msg.i?`<img class='ph' style='margin-top:8px' src='${msg.i}' alt=''>`:''}</div>`:'';
const camBtn=()=>camOn?`<button onclick='cam(false)'>⏹ Stop camera</button>`:`<button class='p' onclick='cam(true)'>📷 Start camera</button>`;
function qr(el,text,size){el.innerHTML='';try{new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}catch(_){el.textContent='QR library not loaded. Open once while online.'}}
const compress=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.65))};im.onerror=no;im.src=u});
/* members */
function addM(){const n=$('#mn').value.trim();if(!n){alert('Enter the member name.');return}S.members.push({id:uid(),name:n,age:$('#ma').value.trim(),village:$('#mv').value.trim(),mobile:$('#mm').value.trim()});save();render()}
function delM(i){const bs=S.bags.filter(b=>b.owner===i);if(!confirm(`Remove ${M(i).name}${bs.length?` and their ${bs.length} bag(s)`:''}?`))return;S.bags=S.bags.filter(b=>b.owner!==i);S.members=S.members.filter(m=>m.id!==i);S.pc=S.pc.filter(x=>x.id!==i);S.bc=S.bc.filter(x=>BG(x.id));view.m=null;save();render()}
/* tags and printing */
function genTags(){const n=Math.max(1,Math.min(100,+$('#qn').value||10)),mx=Math.max(0,...S.tags.map(t=>t.no));for(let i=1;i<=n;i++){const no=mx+i;S.tags.push({id:uid(),no,label:'TG-'+String(no).padStart(3,'0'),token:tok()})}save();msg={c:'ok',t:`${n} new tags generated. Print them and stick one on each bag.`};render()}
function showTag(id){const t=TG(id),b=S.bags.find(x=>x.tagId===id);$('#mt').textContent=t.label;$('#ms').textContent=b?`Bag of ${(M(b.owner)||{}).name||'?'} · ${b.type}`:'Unused tag';$('#modal').style.display='flex';qr($('#mq'),`TRIPGUARD|T|${t.token}`,220);$('#mp').onclick=()=>printTags([id],1)}
function printTags(ids,n){const L=ids.map(TG).filter(Boolean);if(!L.length)return;const sz={1:260,6:150,15:100}[n]||150,p=$('#pr');p.className='g'+n;p.innerHTML=L.map(t=>`<div class='lb'><div id='pq${t.id}'></div><b>${t.label}</b><small>TripGuard · ${e(S.trip.name)}</small></div>`).join('');L.forEach(t=>qr(document.getElementById('pq'+t.id),`TRIPGUARD|T|${t.token}`,sz));setTimeout(()=>window.print(),450)}
const lay=()=>+$('#lay').value;
function printSel(){if(!selT.size){alert('Tick the tags you want to print first.');return}printTags(S.tags.filter(t=>selT.has(t.id)).map(t=>t.id),lay())}
function printUnused(){const u=S.tags.filter(t=>!used(t));if(!u.length){alert('No unused tags.');return}printTags(u.map(t=>t.id),lay())}
function selAll(on){selT=new Set(on?S.tags.map(t=>t.id):[]);render()}
function selTag(id,on){on?selT.add(id):selT.delete(id)}
/* bags */
function regPhoto(inp){const f=inp.files&&inp.files[0];if(f)compress(f).then(d=>{reg.photo=d;render()}).catch(()=>alert('Could not read that image.'))}
function openReg(id){if(id){reg={tag:id,owner:'',type:TYPES[0],desc:'',photo:null};msg=null;render()}}
function editBag(i){const b=BG(i);reg={tag:b.tagId,bag:b.id,owner:b.owner,type:b.type,desc:b.desc,photo:b.photo};msg=null;tab='bags';render();scrollTo(0,0)}
function saveReg(){if(!reg.owner){alert('Choose whose bag this is.');return}const t=TG(reg.tag);if(reg.bag){Object.assign(BG(reg.bag),{owner:reg.owner,type:reg.type,desc:reg.desc.trim(),photo:reg.photo})}else S.bags.push({id:uid(),tagId:reg.tag,owner:reg.owner,type:reg.type,desc:reg.desc.trim(),photo:reg.photo});msg={c:'ok',t:`${t.label} saved for ${M(reg.owner).name}. Scan the next tag.`};reg=null;save();render()}
function delBag(i){if(!confirm('Remove this bag? Its tag becomes unused again.'))return;S.bags=S.bags.filter(b=>b.id!==i);S.bc=S.bc.filter(x=>x.id!==i);save();render()}
const bagCard=b=>{const t=TG(b.tagId);return`<div class='card row'>${b.photo?`<img class='ph' src='${b.photo}' alt=''>`:`<div class='ph nop'>🧳</div>`}<div style='flex:1;min-width:150px'><h3>${t.label} · ${e(b.type)}</h3><div class='mu'>${e(b.desc)||'No description'}</div><div class='mu'>Owner: ${e((M(b.owner)||{}).name||'none')}</div><div class='row' style='margin-top:8px'><button class='s' onclick="editBag('${b.id}')">Edit</button><button class='s' onclick="showTag('${t.id}')">QR</button><button class='s d' onclick="delBag('${b.id}')">Remove</button></div></div></div>`};
/* journey */
function addStop(){const n=$('#sn').value.trim();if(n){S.j.stops.push({id:uid(),name:n});save();render()}}
function delStop(i){S.j.stops.splice(i,1);save();render()}
function moveStop(i,d){const a=S.j.stops,k=i+d;if(k<0||k>=a.length)return;[a[i],a[k]]=[a[k],a[i]];save();render()}
function startTrip(){if(!S.j.from.trim()||!S.j.to.trim()){alert('Enter the start point and the final destination first.');return}if(!S.bags.length&&!confirm('No bags are registered yet. Start the trip anyway?'))return;S.j.started=true;stage='start';save();go('check')}
/* scanning */
function handle(text){const m=String(text).trim().split('|');if(m[0]!=='TRIPGUARD'||m[1]!=='T'||m.length!==3){msg={c:'bad',t:'This is not a TripGuard bag tag.'};return render()}
const t=S.tags.find(x=>x.token===m[2]);if(!t){msg={c:'bad',t:'Unknown tag. It does not belong to this trip on this device.'};return render()}
const b=S.bags.find(x=>x.tagId===t.id);
if(tab==='bags'){if(reg&&reg.tag!==t.id){msg={c:'wn',t:'Save or cancel the bag you are registering first.'}}else if(b){msg={c:'wn',t:`${t.label} is already registered to ${(M(b.owner)||{}).name}. Use Edit to change it.`,i:b.photo};reg=null}else{reg={tag:t.id,owner:'',type:TYPES[0],desc:'',photo:null};msg={c:'ok',t:`${t.label} scanned. Add the bag details below.`}}}
else if(tab==='check')checkBag(t,b);render()}
function checkBag(t,b){if(!b){msg={c:'wn',t:`${t.label} has no bag details yet. Register it in the Bags tab first.`};return}
const s=curStage().id,o=(M(b.owner)||{}).name;if(S.bc.some(x=>x.s===s&&x.id===b.id)){msg={c:'wn',t:`${t.label} (${o}) is already checked in here. Count unchanged.`};return}
S.bc.push({s,id:b.id,t:Date.now()});save();msg={c:'ok',t:`${t.label} checked in for ${o}.`,i:b.photo}}
function manualBag(id){const b=BG(id);if(b)checkBag(TG(b.tagId),b);render()}
function togP(id){const s=curStage().id,i=S.pc.findIndex(x=>x.s===s&&x.id===id);i>=0?S.pc.splice(i,1):S.pc.push({s,id,t:Date.now()});save();render()}
async function cam(on){if(on&&!camOn){$('#cam').style.display='block';try{sc=new Html5Qrcode('cam');await sc.start({facingMode:'environment'},{fps:10,qrbox:220},t=>{const n=Date.now();if(t===last.t&&n-last.at<2500)return;last={t,at:n};handle(t)});camOn=true}catch(_){msg={c:'bad',t:'Camera unavailable or permission denied. Use the manual list instead.'};camOn=false;sc=null}}
else if(!on&&sc){try{await sc.stop();sc.clear()}catch(_){}camOn=false;sc=null}render()}
/* backup */
function exportFile(){const slug=(S.trip.name||'trip').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'trip',name=`TripGuard-${slug}-${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify({app:'TripGuard',version:7,exportedAt:new Date().toISOString(),data:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg={c:'ok',t:`Exported ${name}. Check your Downloads folder.`};render()}
async function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),d=j&&j.data;if(!d||j.app!=='TripGuard'||!Array.isArray(d.members)||!Array.isArray(d.tags)||!Array.isArray(d.bags))throw 0;
if(!confirm(`Import “${(d.trip||{}).name||'trip'}” with ${d.members.length} members, ${d.tags.length} tags and ${d.bags.length} bags? This replaces the trip on this device.`)){inp.value='';return}
S=Object.assign(fresh(),d);S.j=Object.assign(fresh().j,d.j);S.trip=Object.assign(fresh().trip,d.trip);S.bc=d.bc||[];S.pc=d.pc||[];stage=null;reg=null;view.m=null;selT=new Set();save();msg={c:'ok',t:`Imported ${f.name}.`}}catch(_){msg={c:'bad',t:'That file is not a valid TripGuard V7 export (.json).'}}inp.value='';render()}
function wipe(){if(confirm('Delete the whole trip from this device? Export a file first if you need it.')){S=fresh();stage=null;reg=null;view.m=null;save();render()}}
/* views */
const V={
trip(){const st=[[S.members.length>0,'Add members','members'],[S.tags.length>0,'Generate and print QR tags','tags'],[S.bags.length>0,'Scan tags and add bag details','bags'],[!!(S.j.from&&S.j.to),'Set start, connections and destination','journey'],[S.j.started,'Start trip and check in','check']];
return`<h1>Trip</h1><div class='card'><label class='mu' style='margin-top:0'>Trip name</label><input class='wide' value='${e(S.trip.name)}' onchange='S.trip.name=this.value;save()'><label class='mu'>Date</label><input type='date' class='wide' value='${e(S.trip.date)}' onchange='S.trip.date=this.value;save()'></div>
<div class='grid'><div class='card'><div class='big'>${S.members.length}</div><span class='mu'>members</span></div><div class='card'><div class='big'>${S.tags.length}</div><span class='mu'>QR tags</span></div><div class='card'><div class='big'>${S.bags.length}</div><span class='mu'>bags registered</span></div></div><h2>Steps</h2>`+st.map(([d,t,k],i)=>`<div class='card row sp'><span><b>${i+1}.</b> ${t}</span><span class='row'>${tag(d?'Done':'To do',d?'ok':'wn')}<button class='s' onclick="go('${k}')">Open</button></span></div>`).join('')},
members(){if(view.m&&M(view.m)){const m=M(view.m),bs=S.bags.filter(b=>b.owner===m.id);return`<button class='s' onclick='view.m=null;render()'>← All members</button><div class='card'><h2 style='margin-top:0'>${e(m.name)}</h2><p class='mu'>Age ${e(m.age)||'—'} · Village ${e(m.village)||'—'} · Mobile ${e(m.mobile)||'—'}</p></div><h2>Bags (${bs.length})</h2>`+(bs.map(bagCard).join('')||`<div class='card mu'>No bags yet. Scan a tag in the Bags tab and choose ${e(m.name)} as the owner.</div>`)}
return`<h1>Members (${S.members.length})</h1><div class='card'><h3>Add member</h3><div class='grid' style='margin:10px 0'><input id='mn' placeholder='Name'><input id='ma' type='number' min='0' placeholder='Age'><input id='mv' placeholder='Village'><input id='mm' type='tel' placeholder='Mobile no.'></div><button class='p' onclick='addM()'>Add member</button></div>`+(S.members.map(m=>`<div class='card row sp' style='cursor:pointer' onclick="view.m='${m.id}';render()"><div><h3>${e(m.name)}</h3><div class='mu'>Age ${e(m.age)||'—'} · ${e(m.village)||'—'} · ${e(m.mobile)||'—'}</div></div><div class='row'>${tag(S.bags.filter(b=>b.owner===m.id).length+' bags','ld')}<button class='s d' onclick="event.stopPropagation();delM('${m.id}')">Remove</button></div></div>`).join('')||`<div class='card mu'>No members yet. Add the first one above.</div>`)},
tags(){const un=S.tags.filter(t=>!used(t));return`<h1>QR tags</h1>${msgHtml()}<div class='card'><h3>Generate tags</h3><p class='mu'>Common QR stickers with different numbers. Any tag can go on any bag.</p><div class='row'><input id='qn' type='number' min='1' max='100' value='10' style='width:90px' aria-label='How many tags'><button class='p' onclick='genTags()'>Generate</button></div></div>
<div class='card'><h3>Print</h3><div class='row'><select id='lay' aria-label='Layout'><option value='1'>1 tag per page</option><option value='6' selected>6 tags per page</option><option value='15'>15 tags per page</option></select><button class='p' onclick='printSel()'>Print selected</button><button onclick='printUnused()'>Print all unused</button></div><div class='row' style='margin-top:8px'><button class='s' onclick='selAll(true)'>Select all</button><button class='s' onclick='selAll(false)'>Clear selection</button></div></div>
<h2>Tags (${S.tags.length}) · ${un.length} unused</h2><div class='grid'>`+S.tags.map(t=>{const b=S.bags.find(x=>x.tagId===t.id);return`<div class='card' style='margin:0'><label class='row'><input type='checkbox' ${selT.has(t.id)?'checked':''} onchange="selTag('${t.id}',this.checked)"><span class='big'>${t.label}</span></label><div style='margin:6px 0'>${b?tag((M(b.owner)||{}).name||'Assigned','ok'):tag('Unused','mu2')}</div><div class='row'><button class='s' onclick="showTag('${t.id}')">View QR</button><button class='s' onclick="printTags(['${t.id}'],1)">Print</button></div></div>`}).join('')+`</div>`},
bags(){const un=S.tags.filter(t=>!used(t));return`<h1>Bags</h1><div class='card'><h3>Scan a tag, then add the bag details</h3><p class='mu'>Stick the tag on the bag, scan it, and fill in whose bag it is, the type and a photo.</p><div class='row'>${camBtn()}<select aria-label='Choose tag manually' onchange='openReg(this.value)'><option value=''>No camera? Pick a tag…</option>${un.map(t=>`<option value='${t.id}'>${t.label}</option>`).join('')}</select></div></div>${msgHtml()}`},
bags2(){if(reg){const t=TG(reg.tag);return`<div class='card' style='border:2px solid var(--ac)'><h3>${reg.bag?'Edit':'Register'} bag · ${t.label}</h3><label class='mu'>Whose bag?</label><select class='wide' onchange='reg.owner=this.value'><option value=''>Select owner…</option>${S.members.map(m=>`<option value='${m.id}' ${reg.owner===m.id?'selected':''}>${e(m.name)}${m.village?' · '+e(m.village):''}</option>`).join('')}</select><label class='mu'>Bag type</label><select class='wide' onchange='reg.type=this.value'>${TYPES.map(x=>`<option ${reg.type===x?'selected':''}>${x}</option>`).join('')}</select><label class='mu'>Colour / description</label><input class='wide' value='${e(reg.desc)}' oninput='reg.desc=this.value' placeholder='e.g. Blue, large, red ribbon'><label class='mu'>Bag photo</label>${reg.photo?`<img class='ph' style='margin-bottom:8px' src='${reg.photo}' alt=''>`:''}<input class='wide' type='file' accept='image/*' capture='environment' onchange='regPhoto(this)'><div class='row' style='margin-top:12px'><button class='p' onclick='saveReg()'>Save bag</button><button onclick='reg=null;render()'>Cancel</button></div></div>`}
return`<h2>Registered bags (${S.bags.length})</h2>`+(S.bags.map(bagCard).join('')||`<div class='card mu'>No bags registered yet.</div>`)},
journey(){const J=S.j,route=[J.from,...J.stops.map(x=>x.name),J.to].filter(Boolean).join('  →  ');return`<h1>Journey</h1><div class='card'><h3>Main route</h3><label class='mu'>Start point</label><input class='wide' value='${e(J.from)}' placeholder='e.g. Bengaluru' onchange='S.j.from=this.value;save();render()'><label class='mu'>Final destination</label><input class='wide' value='${e(J.to)}' placeholder='e.g. Kashi' onchange='S.j.to=this.value;save();render()'></div>
<div class='card'><h3>Connecting stops (optional)</h3><p class='mu'>Add them in order, from first to last.</p><div class='row'><input id='sn' placeholder='e.g. Vijayawada' style='flex:1'><button class='p' onclick='addStop()'>Add stop</button></div>${J.stops.map((x,i)=>`<div class='item'><span>${i+1}. ${e(x.name)}</span><span class='row'><button class='s' onclick='moveStop(${i},-1)' aria-label='Move up'>↑</button><button class='s' onclick='moveStop(${i},1)' aria-label='Move down'>↓</button><button class='s d' onclick='delStop(${i})'>Remove</button></span></div>`).join('')}</div>
${route?`<div class='msg'>${e(route)}</div>`:''}<div class='card'>${J.started?`<p>${tag('Trip started','ok')}</p><div class='row'><button class='p' onclick="go('check')">Go to check-in</button><button class='d' onclick='S.j.started=false;save();render()'>Stop trip</button></div>`:`<button class='p wide' onclick='startTrip()'>▶ Start trip</button><p class='mu'>Then choose the check-in point and scan the bags.</p>`}</div>`},
check(){if(!S.j.started)return`<h1>Check-in</h1><div class='card'><p>Start the trip first.</p><button class='p' onclick="go('journey')">Go to Journey</button></div>`;const cs=curStage();
return`<h1>Check-in</h1><div class='card'><label class='mu' style='margin-top:0'>Check-in point</label><select class='wide' onchange='stage=this.value;msg=null;render()'>${stages().map(x=>`<option value='${x.id}' ${cs.id===x.id?'selected':''}>${x.role}: ${e(x.name)}</option>`).join('')}</select><div class='row' style='margin-top:10px'><button class='${ctab==='bag'?'p':''}' onclick="ctab='bag';msg=null;render()">🧳 Bag check-in</button><button class='${ctab==='pax'?'p':''}' onclick="ctab='pax';msg=null;if(camOn)cam(false);else render()">👥 Passenger check-in</button></div></div>`+(ctab==='bag'?`<div class='card row'>${camBtn()}<select aria-label='Manual bag check-in' onchange="if(this.value){manualBag(this.value)}"><option value=''>No camera? Pick a bag…</option>${S.bags.filter(b=>!S.bc.some(x=>x.s===cs.id&&x.id===b.id)).map(b=>`<option value='${b.id}'>${TG(b.tagId).label} · ${e((M(b.owner)||{}).name)}</option>`).join('')}</select></div>${msgHtml()}`:'')},
check2(){if(!S.j.started)return'';const s=curStage().id;
if(ctab==='pax'){const dn=new Set(S.pc.filter(x=>x.s===s).map(x=>x.id)),n=S.members.filter(m=>dn.has(m.id)).length,t=S.members.length;return`<div class='card'><div class='row sp'><h3>Passengers checked in</h3>${tag(n+' / '+t,n===t&&t?'ok':'wn')}</div><div class='bar'><i style='width:${t?n/t*100:0}%'></i></div><span class='mu'>${t-n} pending</span></div><div class='card'>`+(S.members.map(m=>`<div class='item'><div><b>${e(m.name)}</b><div class='mu'>${e(m.village)} ${e(m.mobile)}</div></div>${dn.has(m.id)?`<span class='row'>${tag('Checked in '+tm(S.pc.find(x=>x.s===s&&x.id===m.id).t),'ok')}<button class='s' onclick="togP('${m.id}')">Undo</button></span>`:`<button class='s p' onclick="togP('${m.id}')">Check in</button>`}</div>`).join('')||`<span class='mu'>No members.</span>`)+`</div>`}
const when={};S.bc.filter(x=>x.s===s).forEach(x=>when[x.id]=x.t);const tot=S.bags.length,dn=S.bags.filter(b=>when[b.id]).length;
const own=S.members.filter(m=>S.bags.some(b=>b.owner===m.id)).map(m=>{const bs=S.bags.filter(b=>b.owner===m.id).sort((a,b)=>(when[b.id]||0)-(when[a.id]||0)||TG(a.tagId).no-TG(b.tagId).no);return{m,bs,n:bs.filter(b=>when[b.id]).length,t:Math.max(0,...bs.map(b=>when[b.id]||0))}}).sort((a,b)=>b.t-a.t||a.m.name.localeCompare(b.m.name));
return`<div class='card'><div class='row sp'><h3>Bags checked in</h3>${tag(dn+' / '+tot,dn===tot&&tot?'ok':'wn')}</div><div class='bar'><i style='width:${tot?dn/tot*100:0}%'></i></div><span class='mu'>${tot-dn} pending</span></div>`+(own.map(o=>`<div class='card'><div class='row sp'><div><h3>${e(o.m.name)}</h3><span class='mu'>${e(o.m.village)}</span></div>${tag(o.n+' / '+o.bs.length+' bags',o.n===o.bs.length?'ok':'wn')}</div>${o.bs.map(b=>`<div class='item'><span class='row'>${b.photo?`<img class='th' src='${b.photo}' alt=''>`:''}<span><b>${TG(b.tagId).label}</b> ${e(b.type)}<div class='mu'>${e(b.desc)}</div></span></span>${when[b.id]?tag('✓ '+tm(when[b.id]),'ok'):`<span class='row'>${tag('Pending','bad')}<button class='s' onclick="manualBag('${b.id}')">Check</button></span>`}</div>`).join('')}</div>`).join('')||`<div class='card mu'>No bags registered yet.</div>`)},
backup(){return`<h1>Backup</h1>${msgHtml()}<div class='card'><h3>Export</h3><p class='mu'>Saves the whole trip as one <b>.json</b> file: members, tags, bags with photos, journey and check-ins. Keep it private; it contains names and mobile numbers.</p><button class='p' onclick='exportFile()'>⬇ Export trip file</button></div>
<div class='card'><h3>Import</h3><p class='mu'>Upload a TripGuard .json file exported from this app. It replaces the trip on this device.</p><input type='file' class='wide' accept='.json,application/json' onchange='importFile(this)'></div>
<div class='card'><h3>This device</h3><p class='mu'>${S.members.length} members · ${S.tags.length} tags · ${S.bags.length} bags. Data lives only in this browser until you export it.</p><button class='d' onclick='wipe()'>Delete all data</button></div>`}};
const T=[['trip','🏠','Trip'],['members','👥','Members'],['tags','🏷️','QR tags'],['bags','🧳','Bags'],['journey','🗺️','Journey'],['check','✅','Check-in'],['backup','💾','Backup']];
function go(t){if(camOn&&t!==tab)cam(false);tab=t;msg=null;view.m=null;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=T.map(([k,i,n])=>`<button class='${tab===k?'on':''}' onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('');
$('#v').innerHTML=V[tab]();$('#v2').innerHTML=V[tab+'2']?V[tab+'2']():'';$('#cam').style.display=camOn&&(tab==='bags'||(tab==='check'&&ctab==='bag'))?'block':'none'}
(async()=>{const d=await idb('get');if(d&&d.members){S=Object.assign(fresh(),d);S.j=Object.assign(fresh().j,d.j)}ready=true;render()})();render();
</script></body></html>
