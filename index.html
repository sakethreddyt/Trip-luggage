<style>

<main><div id="v"></div><div id="cam" style="display:none"></div><div id="v2"></div><p class="mu" style="text-align:center">TripGuard V6 · Offline-first travel & luggage checklist</p></main>
<div id="modal"><div class="card"><h3 id="mt"></h3><p class="mu" id="ms"></p><div class="q" id="mq"></div><p class="mu">Press and hold the image to save it to this phone.</p><button onclick="modal.style.display='none'" class="p wide">Close</button></div></div>
<nav id="nav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const tok=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
let S={trip:"My journey",people:[],bags:[],stays:[],legs:[],scans:[],qrStock:[]},tab="home",act=null,sel={leg:"",cp:"dep"},msg=null,sc=null,camOn=false,last={t:"",at:0},ready=false,pendingStockToken=null;
const DRIVE={clientId:localStorage.getItem("tg_google_client_id")||"",token:null,email:"",fileId:new URLSearchParams(location.search).get("driveFileId")||localStorage.getItem("tg_drive_file_id")||"",ownerEmail:new URLSearchParams(location.search).get("owner")||localStorage.getItem("tg_drive_owner")||"",version:null,etag:null,dirty:false,role:"",isOwner:false,lastSync:null,poll:null,busy:false};
const idb=(m,v)=>new Promise(r=>{try{const key="s";const q=indexedDB.open("tripguard",1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("k"))q.result.createObjectStore("k")};q.onsuccess=()=>{const o=q.result.transaction("k",m==="get"?"readonly":"readwrite").objectStore("k");const x=m==="get"?o.get(key):o.put(v,key);x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()}catch(_){r()}});
const save=()=>{if(ready){DRIVE.dirty=true;idb("put",S);}};
const P=i=>S.people.find(x=>x.id===i),B=i=>S.bags.find(x=>x.id===i),L=i=>S.legs.find(x=>x.id===i),Y=i=>S.stays.find(x=>x.id===i);
const cur=()=>L(sel.leg)||S.legs[0];
const adults=()=>S.people.filter(p=>p.type==="adult");
function chk(l,cp){const s=S.scans.filter(x=>x.leg===l.id&&x.cp===cp),pv=new Set(s.filter(x=>x.type==="P").map(x=>x.id)),bv=new Set(s.filter(x=>x.type==="B").map(x=>x.id));
return{pv,bv,pm:l.people.filter(i=>!pv.has(i)),bm:l.bags.filter(i=>!bv.has(i)),un:[...bv].filter(i=>!l.bags.includes(i)),st:S.bags.filter(b=>b.stay&&!l.bags.includes(b.id))}}
function st(b){if(b.stay)return["Stored at "+((Y(b.stay)||{}).name||"stay"),"st"];const s=S.scans.filter(x=>x.type==="B"&&x.id===b.id).pop(),l=s&&L(s.leg);
if(l)return s.cp==="dep"?["Loaded: "+l.from+" to "+l.to,"ld"]:["Unloaded at "+l.to,"ok"];return S.legs.some(l=>l.bags.includes(b.id))?["Packed","mu2"]:["Registered","mu2"]}
const tag=(t,c)=>`<span class="tag ${c}">${e(t)}</span>`;
function qr(el,text,size){el.innerHTML="";try{new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}catch(_){el.textContent="QR library not loaded. Go online once."}}
function show(type,id){const o=type==="P"?P(id):B(id);$("#mt").textContent=type==="P"?o.name:o.label;$("#ms").textContent=type==="P"?"Adult passenger QR":(o.desc||"Luggage QR");modal.style.display="flex";qr($("#mq"),`TRIPGUARD|${type}|${o.token}`,220)}
/* actions */
function add(f){f();save();render()}
function addPerson(){const n=$("#pn").value.trim();if(!n)return;add(()=>S.people.push({id:uid(),name:n,type:$("#pt").value,resp:$("#pr").value||null,token:tok()}))}
function delPerson(i){add(()=>{S.people=S.people.filter(p=>p.id!==i);S.legs.forEach(l=>l.people=l.people.filter(x=>x!==i));if(act===i)act=null})}
function nextQrLabel(){const nums=[...S.qrStock.map(x=>x.label),...S.bags.map(x=>x.label)].map(x=>+(String(x).match(/(\\d+)$/)||[])[1]||0);return "TG-"+String(Math.max(0,...nums)+1).padStart(3,"0")}
function genQrStock(){const n=Math.max(1,Math.min(100,+$("#qn").value||20));add(()=>{for(let i=0;i<n;i++)S.qrStock.push({id:uid(),label:nextQrLabel(),token:tok(),status:"available",createdAt:Date.now()})});msg={c:"ok",t:`${n} unused QR stickers generated. Print them before your trip.`};render()}
function beginBagActivation(){pendingStockToken=null;tab="scan";msg={c:"wn",t:"Start the camera and scan an unused TripGuard luggage sticker. It will open the registration form."};render();scrollTo(0,0)}
function addBagForm(){
 const stock=S.qrStock.find(x=>x.token===pendingStockToken&&x.status==="available");
 if(!stock){alert("First scan an unused printed luggage QR sticker in the Scan tab.");return}
 const type=$("#bt").value,colour=$("#bc").value.trim(),owner=$("#bo").value||null,desc=$("#bd").value.trim(),file=$("#bp").files&&$("#bp").files[0];
 const finish=photoData=>{const b={id:uid(),label:stock.label,token:stock.token,stockId:stock.id,owner,desc,type,colour,photo:photoData||null,stay:null};stock.status="activated";stock.activatedAt=Date.now();S.bags.push(b);pendingStockToken=null;save();render();show("B",b.id)};
 if(file){if(file.size>4*1024*1024){alert("Please choose a photo smaller than 4 MB.");return}const reader=new FileReader();reader.onload=()=>finish(reader.result);reader.onerror=()=>alert("Could not read that photo.");reader.readAsDataURL(file)}else finish(null)
}
function setBag(i,k,v){B(i)[k]=v||null;save();render()}
function descBag(i,v){B(i).desc=v;save()}
function photo(id,inp){const f=inp.files&&inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);B(id).photo=c.toDataURL("image/jpeg",0.7);URL.revokeObjectURL(u);save();msg={c:"ok",t:B(id).label+" photo saved on this device only."};render()};im.onerror=()=>{alert("Could not read that image.")};im.src=u}
function rmPhoto(id){B(id).photo=null;save();render()}
function delBag(i){add(()=>{S.bags=S.bags.filter(b=>b.id!==i);S.legs.forEach(l=>l.bags=l.bags.filter(x=>x!==i))})}
function addStay(){const n=$("#sn").value.trim();if(n)add(()=>S.stays.push({id:uid(),name:n}))}
function addLeg(){const f=$("#lf").value.trim(),t=$("#lt").value.trim();if(!f||!t)return;add(()=>{const l={id:uid(),from:f,to:t,mode:$("#lm").value,kind:$("#lk").value,people:S.people.map(p=>p.id),bags:S.bags.filter(b=>!b.stay).map(b=>b.id)};S.legs.push(l);sel.leg=l.id})}
function delLeg(i){add(()=>{S.legs=S.legs.filter(l=>l.id!==i);S.scans=S.scans.filter(s=>s.leg!==i)})}
function tog(i,k,id,on){const l=L(i);l[k]=on?[...new Set([...l[k],id])]:l[k].filter(x=>x!==id);save();render()}
function collect(id,leg){const b=B(id);b.stay=null;if(leg&&!L(leg).bags.includes(id))L(leg).bags.push(id);msg={c:"ok",t:`${b.label} collected from storage${leg?" and added to this leg":""}.`};save();render()}
/* scanning */
function rec(type,id,by){const l=cur();S.scans.push({leg:l.id,cp:sel.cp,type,id,by:by||null,t:Date.now()});save()}
function dup(type,id){const l=cur();return S.scans.some(s=>s.leg===l.id&&s.cp===sel.cp&&s.type===type&&s.id===id)}
function handle(text){
 const m=String(text).trim().split("|");
 if(m[0]!=="TRIPGUARD"||m.length!==3||!"PB".includes(m[1])){msg={c:"bad",t:"Not a TripGuard QR code."};return render()}
 if(m[1]==="B"){
  const stock=S.qrStock.find(x=>x.token===m[2]&&x.status==="available");
  if(stock){pendingStockToken=stock.token;msg={c:"ok",t:`Unused sticker ${stock.label} scanned. Add the bag details and photo to activate it.`};if(camOn)cam(false);tab="bags";render();scrollTo(0,0);return}
 }
 if(!cur()){msg={c:"bad",t:"Create a trip leg before scanning passenger or registered luggage QRs. Unused QR stickers can be registered without a leg."};return render()}
 if(m[1]==="P"){const p=S.people.find(x=>x.token===m[2]);if(!p)msg={c:"bad",t:"Unknown passenger QR. It is not in this trip on this device."};
 else{act=p.id;if(dup("P",p.id))msg={c:"wn",t:`${p.name} was already scanned here. Count unchanged.`};else{rec("P",p.id);msg={c:"ok",t:`${p.name} is present. Now scan their bags.`}}}}
 else{const b=S.bags.find(x=>x.token===m[2]);if(!b)msg={c:"bad",t:"This QR is not in the unused inventory or registered luggage for this trip."};
 else if(!act)msg={c:"wn",t:"Scan or choose an adult first, so the bag gets an owner."};
 else{markBag(b.id,act);if(msg&&b.photo)msg.i=b.photo}}render()}
function markBag(id,by,force){const b=B(id),a=P(by),l=cur();
if(b.stay&&!force){msg={c:"wn",t:`${b.label} is stored at ${(Y(b.stay)||{}).name}. Collect it before putting it on this leg.`,b:["Collect and add to this leg",`collect('${id}','${l.id}');`]};return}
if(b.owner&&b.owner!==by&&!force){msg={c:"wn",t:`${b.label} belongs to ${(P(b.owner)||{}).name}, not ${a.name}.`,b:[`Reassign to ${a.name}`,`B('${id}').owner='${by}';markBag('${id}','${by}',true);render()`]};return}
if(!b.owner)b.owner=by;
if(dup("B",id)){msg={c:"wn",t:`${b.label} was already scanned here. Count unchanged.`};return}
rec("B",id,by);const ex=l.bags.includes(id);msg={c:ex?"ok":"wn",t:ex?`${b.label} verified for ${a.name}.`:`${b.label} verified, but it was not planned for this leg. Check the Trip tab.`}}
function manual(type,id){if(dup(type,id)){msg={c:"wn",t:"Already verified here."};return render()}
if(type==="P"){rec("P",id,"manual");msg={c:"ok",t:`${P(id).name} marked present by hand.`}}else{const b=B(id);if(b.stay){msg={c:"wn",t:"This bag is stored. Collect it first."};return render()}rec("B",id,"manual");msg={c:"ok",t:`${b.label} marked by hand.`}}save();render()}
async function cam(on){
 if(on&&!camOn){
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){msg={c:"bad",t:"Camera access requires the actual HTTPS GitHub Pages website. Open the https://sakethreddyt.github.io/... address directly in Chrome, not a WhatsApp preview or a downloaded HTML file."};render();return}
  if(typeof Html5Qrcode==="undefined"){msg={c:"bad",t:"The QR scanner library has not loaded. Connect to the internet, reload TripGuard, and try again. You can still paste the QR text manually."};render();return}
  $("#cam").style.display="block";
  try{
   sc=new Html5Qrcode("cam",{verbose:false});
   const config={fps:10,qrbox:(vw,vh)=>{const z=Math.max(180,Math.min(260,Math.floor(Math.min(vw,vh)*0.72)));return{width:z,height:z}},aspectRatio:1.0,disableFlip:false};
   try{await sc.start({facingMode:"environment"},config,t=>{const n=Date.now();if(t===last.t&&n-last.at<2500)return;last={t,at:n};handle(t)},()=>{});}
   catch(firstError){
    const devices=await Html5Qrcode.getCameras();
    if(!devices?.length)throw firstError;
    const rear=devices.find(d=>/back|rear|environment/i.test(d.label))||devices[devices.length-1];
    await sc.start(rear.id,config,t=>{const n=Date.now();if(t===last.t&&n-last.at<2500)return;last={t,at:n};handle(t)},()=>{});
   }
   camOn=true;msg={c:"ok",t:"Camera started. Point it steadily at a TripGuard QR sticker."};$("#cam").scrollIntoView({block:"nearest"});
  }catch(err){
   const detail=String(err?.message||err||"").slice(0,140);
   msg={c:"bad",t:"TripGuard could not start the camera. Check Chrome site settings → Camera → Allow for sakethreddyt.github.io, close other camera apps, reload the page, and try again. If it still fails, use manual QR text entry. "+(detail?"Details: "+detail:"")};
   try{if(sc){await sc.clear()}}catch(_){}camOn=false;sc=null;
  }
 }else if(!on&&sc){try{await sc.stop();await sc.clear()}catch(_){}camOn=false;sc=null}
 if(tab==="scan")render()
}
/* views */
const V={
home(){const a=adults().length,c=S.people.length-a,s=S.bags.filter(b=>b.stay).length;
return`<div class="row sp"><h1>TripGuard</h1><span class="tag ok">V6</span></div><div class="card"><label class="mu">Trip name</label><input class="wide" value="${e(S.trip)}" onchange="S.trip=this.value;save()"></div>
<div class="grid"><div class="card"><h1>${a}</h1><span class="mu">adults</span></div><div class="card"><h1>${c}</h1><span class="mu">children</span></div><div class="card"><h1>${S.bags.length}</h1><span class="mu">bags</span></div><div class="card"><h1>${s}</h1><span class="mu">stored at stays</span></div></div>
<div class="msg" style="border-color:var(--ac)">TripGuard saves locally on this device. Use More to export a backup and share it through Google Drive.</div>
<h2>Journey</h2>${S.legs.length?S.legs.map(l=>{const d=chk(l,"dep"),r=chk(l,"arr"),tot=l.people.length+l.bags.length,got=d.pv.size+d.bv.size-d.un.length;return`<div class="card"><div class="row sp"><h3>${e(l.from)} to ${e(l.to)}</h3>${tag(l.kind==="side"?"Side trip":l.kind==="conn"?"Connection":"Leg","mu2")}</div><p class="mu">${e(l.mode)} · ${l.people.length} people · ${l.bags.length} bags</p><div class="bar"><i style="width:${tot?Math.min(100,got/tot*100):0}%"></i></div><p class="mu">Departure ${got}/${tot} checked · Arrival ${r.pv.size+r.bv.size-r.un.length}/${tot}</p></div>`}).join(""):`<div class="card">No legs yet. Open the Trip tab and add your first leg, for example Bengaluru to Vijayawada.</div>`}`},
people(){return`<h1>People</h1><div class="card"><div class="row"><input id="pn" placeholder="Name" style="flex:1"><select id="pt"><option value="adult">Adult</option><option value="child">Child</option></select></div>
<div class="row" style="margin-top:8px"><select id="pr"><option value="">Responsible adult (for children)</option>${adults().map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join("")}</select><button class="p" onclick="addPerson()">Add person</button></div><p class="mu">Adults receive a passenger QR. Children can be linked to a responsible adult. Add relatives at any stop.</p></div>
${S.people.length?S.people.map(p=>{const owned=S.bags.filter(b=>b.owner===p.id),l=cur(),scanned=new Set(S.scans.filter(s=>s.leg===l?.id&&s.cp===sel.cp&&s.type==="B").map(s=>s.id)),expected=owned.filter(b=>l&&l.bags.includes(b.id)),checked=expected.filter(b=>scanned.has(b.id)).length,pending=expected.length-checked;return`<div class="card"><div class="row sp"><div><h3>${e(p.name)}</h3><span class="mu">${p.type==="adult"?"Adult":"Child of "+e((P(p.resp)||{}).name||"unassigned")}</span></div><div class="row">${p.type==="adult"?`<button class="s p" onclick="show('P','${p.id}')">Passenger QR</button>`:""}<button class="s d" onclick="delPerson('${p.id}')">Remove</button></div></div><div class="grid"><div><b>${owned.length}</b><div class="mu">Registered bags</div></div><div><b class="ok">${checked}</b><div class="mu">Checked this checkpoint</div></div><div><b class="wn">${pending}</b><div class="mu">Pending this leg</div></div></div>${owned.map(b=>`<div class="row sp chk"><span>${e(b.label)} · ${e(b.type||"Bag")} ${e(b.colour||"")}</span>${tag(scanned.has(b.id)?"Checked":(expected.includes(b)?"Pending":"Not on this leg"),scanned.has(b.id)?"ok":(expected.includes(b)?"wn":"mu2"))}</div>`).join("")||'<p class="mu">No luggage registered to this person yet.</p>'}</div>`}).join(""):`<div class="card">Add the first traveller above.</div>`}`},
bags(){const pending=S.qrStock.find(x=>x.token===pendingStockToken&&x.status==="available");return`<h1>Luggage</h1>

${msg?`<div class="msg" style="border-color:var(--${msg.c==="ok"?"ok":msg.c==="bad"?"bad":"wn"})">${e(msg.t)}${msg.i?`<br><img class="ph" src="${msg.i}" alt="Scanned bag">`:""}${msg.b?`<br><button class="s p" style="margin-top:8px" onclick="${msg.b[1]}">${e(msg.b[0])}</button>`:""}</div>`:""}`:`<div class="card">Add a leg in the Trip tab first.</div>`}`},
scan2(){
 const l=cur();if(!l)return"";
 const c=chk(l,sel.cp),active=act?P(act):null,ok=!c.pm.length&&!c.bm.length&&!c.un.length;
 const owned=active?S.bags.filter(b=>b.owner===active.id):[],expected=owned.filter(b=>l.bags.includes(b.id)),checked=expected.filter(b=>c.bv.has(b.id)),pending=expected.filter(b=>!c.bv.has(b.id));
 const activeRows=owned.map(b=>{const ex=expected.includes(b),done=c.bv.has(b.id);return `<div class="row sp chk"><span>${e(b.label)} · ${e(b.type||"Bag")} ${e(b.colour||"")}</span>${tag(done?"Checked":(ex?"Pending":"Not on this leg"),done?"ok":(ex?"wn":"mu2"))}</div>`}).join("");
 const personCard=active?`<div class="card"><div class="row sp"><h3>${e(active.name)} – luggage summary</h3>${tag("Selected passenger","ok")}</div><div class="grid"><div><b>${owned.length}</b><div class="mu">Registered bags</div></div><div><b class="ok">${checked.length}</b><div class="mu">Checked</div></div><div><b class="wn">${pending.length}</b><div class="mu">Pending</div></div></div>${activeRows||'<p class="mu">No bags registered for this passenger.</p>'}</div>`:"";
 const allRows=S.people.map(p=>{const pb=S.bags.filter(b=>b.owner===p.id),ex=pb.filter(b=>l.bags.includes(b.id)),done=ex.filter(b=>c.bv.has(b.id)).length;return `<div class="row sp chk"><span><b>${e(p.name)}</b> <span class="mu">${p.type==="adult"?"Adult":"Child"}</span><br><span class="mu">${pb.length} registered · ${done} checked · ${ex.length-done} pending</span></span>${tag(c.pv.has(p.id)?"Present":"Not checked",c.pv.has(p.id)?"ok":"wn")}</div>`}).join("");
 const childRows=active?S.people.filter(p=>p.resp===active.id&&l.people.includes(p.id)&&!c.pv.has(p.id)).map(k=>`<div class="row sp chk"><span>${e(k.name)}</span><button class="s p" onclick="manual('P','${k.id}')">Present</button></div>`).join(""):"";
 const peoplePending=c.pm.map(i=>`<div class="row sp chk"><span>${e(P(i).name)}</span><button class="s" onclick="manual('P','${i}')">Mark present</button></div>`).join("");
 const bagsPending=c.bm.map(i=>`<div class="row sp chk"><span>${e(B(i).label)} ${e(B(i).desc)}</span><button class="s" onclick="manual('B','${i}')">Mark by hand</button></div>`).join("");
 const unexpected=c.un.map(i=>`<div class="chk">${e(B(i).label)} ${e(B(i).desc)}</div>`).join("");

 return `${childRows?`<div class="card"><b>Confirm children with ${e(active.name)}</b>${childRows}</div>`:""}${personCard}<div class="card"><div class="row sp"><h3>All passengers – overview</h3>${tag("All people","mu2")}</div>${allRows||'<p class="mu">No passengers added.</p>'}</div><div class="card"><div class="row sp"><h3>${sel.cp==="dep"?"Departure":"Arrival"} summary</h3>${tag(ok?"All clear":"Needs attention",ok?"ok":"wn")}</div><p class="mu">People ${c.pv.size}/${l.people.length} · Bags ${l.bags.length-c.bm.length}/${l.bags.length}</p>${peoplePending?`<h3 class="wn">People not checked</h3>${peoplePending}`:""}${bagsPending?`<h3 class="bad">Expected bags not scanned</h3>${bagsPending}`:""}${unexpected?`<h3 class="wn">Scanned, not planned for this leg</h3>${unexpected}`:""}${stored?`<h3 class="st">Stored, not expected (never missing)</h3>${stored}`:""}<p class="mu">A scan is a checklist aid. It does not prove a bag is physically loaded or a person is safe.</p></div>`
},

<p><b>${S.qrStock.filter(x=>x.status==="available").length}</b> unused · <b>${S.qrStock.filter(x=>x.status==="activated").length}</b> assigned · <b>${S.bags.length}</b> registered bags</p>

<h2>Backup and sharing</h2><div class="card"><div class="row"><button class="p" onclick="exportBackup()">Export backup</button><button onclick="shareBackup()">Share backup file</button><button onclick="imp()">Import backup</button><button class="d" onclick="wipe()">Delete all data</button></div>

<div class="msg" style="border-color:var(--ac)">This version does not use a backend or hosting server. Google Drive is the shared file store. Updates are synchronized by manual refresh and periodic checks; simultaneous edits can conflict. Google Drive permissions protect access to the shared trip file.</div></div>
<h2>Google Drive backup & sharing</h2><div class="card">
<p><b>No Google Cloud setup. No OAuth. No API keys.</b></p>
<p class="mu">TripGuard keeps working offline on this device. To share a trip with your group, export a backup file, put it in Google Drive, and use Drive's normal Share screen to approve each person's Google account.</p>

<div class="msg" style="border-color:var(--wn)"><b>Important:</b> This no-server version does not provide automatic multi-phone live sync or an in-app approval dashboard. Drive controls who can open the shared backup; TripGuard imports/exports snapshots. If several people edit, agree who updates the master file to avoid overwriting one another's changes.</div>

function backupObject(){return {schemaVersion:2,exportedAt:new Date().toISOString(),data:S}}
function exportBackup(){const text=JSON.stringify(backupObject(),null,2);$("#bk").value=text;const blob=new Blob([text],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`TripGuard-${(S.trip||"Trip").replace(/[^a-z0-9-_]+/gi,"-")}-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function shareBackup(){const text=JSON.stringify(backupObject()),file=new File([text],"tripguard-backup.json",{type:"application/json"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:"TripGuard trip backup",text:"Import this backup in TripGuard on the other device.",files:[file]})}catch(_){}}else{exportBackup();alert("Backup downloaded. Send it to the other traveller, then import it in TripGuard.")}}
function imp(){try{const j=JSON.parse($("#bk").value);if(!j.data||!Array.isArray(j.data.people)||!Array.isArray(j.data.bags))throw 0;S=Object.assign({trip:"",people:[],bags:[],stays:[],legs:[],scans:[],qrStock:[]},j.data);S.qrStock=S.qrStock||[];S.bags=S.bags.map(b=>({...b,type:b.type||"Other",colour:b.colour||"",photo:b.photo||null}));save();msg=null;render()}catch(_){alert("That text is not a valid TripGuard backup.")}}
async function importBackupFile(file){if(!file)return;try{const j=JSON.parse(await file.text());if(!j.data||!Array.isArray(j.data.people)||!Array.isArray(j.data.bags))throw 0;if(!confirm(`Import trip “${j.data.trip||"My journey"}”? This replaces the trip currently saved on this device.`))return;S=Object.assign({trip:"My journey",people:[],bags:[],stays:[],legs:[],scans:[],qrStock:[]},j.data);S.qrStock=S.qrStock||[];S.bags=S.bags.map(b=>({...b,type:b.type||"Other",colour:b.colour||"",photo:b.photo||null}));save();msg={c:"ok",t:"Trip backup imported and saved on this device."};render()}catch(_){alert("Could not import this file. Choose a valid TripGuard JSON backup.")}finally{const el=document.getElementById("backupFile");if(el)el.value=""}}
function wipe(){if(confirm("Delete the whole trip from this device?")){S={trip:"My journey",people:[],bags:[],stays:[],legs:[],scans:[],qrStock:[]};act=null;sel.leg="";save();render()}}

(async()=>{const d=await idb("get");if(d&&d.people)S=Object.assign({qrStock:[]},d);S.qrStock=S.qrStock||[];ready=true;if(!navigator.onLine)msg=null;render()})();render();
